<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ПАР·КЕТ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>try{var t=localStorage.getItem("parket.theme");if(t==="dark"||t==="light"){document.documentElement.dataset.theme=t;document.documentElement.dataset.scheme=t;}}catch(e){}</script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="toast" class="toast" hidden></div>

<!-- Порядок важен: каждый файл использует то, что объявлено выше. Подробности в README.md -->
<script src="config/profiles.js"></script>
<script src="js/core.js"></script>
<script src="js/state.js"></script>
<script src="js/domain.js"></script>
<script src="js/cards.js"></script>
<script src="js/views.js"></script>
<script src="js/sheets.js"></script>
<script src="js/app.js"></script>

<script>
// Защита от неполной заливки: если какой-то файл не загрузился, скажем об этом, а не покажем пустой экран.
(function () {
  var path = { config: 'config/profiles.js', core: 'js/core.js', state: 'js/state.js', domain: 'js/domain.js',
    cards: 'js/cards.js', views: 'js/views.js', sheets: 'js/sheets.js', app: 'js/app.js' };
  var need = ['config', 'core', 'state', 'domain', 'cards', 'views', 'sheets', 'app'];
  var have = window.PARTS || [];
  var miss = need.filter(function (n) { return have.indexOf(n) < 0; });
  if (!miss.length) return;
  window.APP_BROKEN = true;   // render() в js/app.js после этого ничего не рисует, сообщение не затрётся
  var box = document.getElementById('app');
  if (box) box.innerHTML = '<div style="padding:24px;font:16px/1.4 system-ui,sans-serif">' +
    '<b>Приложение загрузилось не полностью.</b><br>Не найдены файлы: ' +
    miss.map(function (n) { return path[n]; }).join(', ') +
    '.<br>Залей их в репозиторий (одним коммитом со всеми остальными) и обнови страницу.</div>';
})();
</script>
</body>
</html>
