<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ПАР·КЕТ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>try{var t=localStorage.getItem("parket.theme");if(t==="dark"||t==="light"){document.documentElement.dataset.theme=t;document.documentElement.dataset.scheme=t;}}catch(e){}</script>
<style>
:root {
  --bg: var(--tg-theme-bg-color, #ffffff);
  --surface: var(--tg-theme-secondary-bg-color, #f0f1f4);
  --text: var(--tg-theme-text-color, #14171c);
  --hint: var(--tg-theme-hint-color, #66707e);
  --line: rgba(127, 127, 127, .24);
  --accent: #1f6fd1;
  --accent-text: #1f6fd1;
  --accent-soft: rgba(31, 111, 209, .14);
  --lec: #1f8a4c;
  --pr: #b96f00;
  --lab: #7a3fb0;
  --other: #5b6472;
}
[data-profile="her"] {
  --accent: #c93d63;
  --accent-text: #c93d63;
  --accent-soft: rgba(201, 61, 99, .14);
}
[data-scheme="dark"] { --accent-text: #6aa8f5; }
[data-scheme="dark"][data-profile="her"] { --accent-text: #f2809c; }

:root[data-theme="dark"] { --bg: #17181c; --surface: #23252b; --text: #eceef2; --hint: #9aa1ad; --line: rgba(255, 255, 255, .14); }
:root[data-theme="light"] { --bg: #ffffff; --surface: #f0f1f4; --text: #14171c; --hint: #66707e; --line: rgba(127, 127, 127, .24); }
:root[data-scheme="dark"] { color-scheme: dark; }
:root[data-scheme="light"] { color-scheme: light; }


* { box-sizing: border-box; margin: 0; }
html, body {
  background: var(--bg);
  color: var(--text);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  -webkit-text-size-adjust: 100%;
}
body {
  min-height: 100vh;
  padding: calc(var(--tg-safe-area-inset-top, env(safe-area-inset-top, 0px)) + var(--tg-content-safe-area-inset-top, 0px) + 10px) 14px calc(env(safe-area-inset-bottom) + 84px);
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.switch { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px; background: var(--surface); border-radius: 14px; }
.switch button { padding: 9px 10px; border-radius: 10px; text-align: center; line-height: 1.2; }
.switch small { display: block; min-height: 15px; color: var(--hint); font-size: 12px; }
.switch button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 600; }
.switch button[aria-pressed="true"] small { color: rgba(255, 255, 255, .88); }

h2 { font-size: 13px; font-weight: 600; color: var(--hint); margin: 18px 2px 4px; }

.up { margin-top: 14px; padding: 12px; border-radius: 16px; background: var(--accent-soft); }
.up .cap { font-size: 14px; font-weight: 600; color: var(--accent-text); margin-bottom: 8px; }
.up .lesson { background: var(--bg); margin-top: 0; }
.bar { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 10px; }
.bar i { display: block; height: 100%; background: var(--accent); transition: width .6s; }

.lesson { display: grid; grid-template-columns: 52px 1fr; gap: 10px; padding: 12px; margin-top: 8px; background: var(--surface); border-radius: 14px; }
.t b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
.t span { color: var(--hint); font-size: 13px; font-variant-numeric: tabular-nums; }
.ttl { font-weight: 600; }
.badge { display: inline-block; padding: 1px 7px; margin-right: 6px; border-radius: 6px; font-size: 12px; font-weight: 600; color: #fff; background: var(--other); vertical-align: 1px; }
.k-lec { background: var(--lec); }
.k-pr { background: var(--pr); }
.k-lab { background: var(--lab); }
.meta { color: var(--hint); font-size: 14px; margin-top: 2px; }
details { margin-top: 6px; color: var(--hint); font-size: 14px; }
summary { cursor: pointer; }
.vars { display: grid; gap: 2px; margin-top: 4px; }
.past { margin: 14px 2px 0; }
.past .lesson { opacity: .6; }

.empty { margin-top: 14px; padding: 16px; border-radius: 16px; background: var(--surface); }
.err { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: rgba(220, 60, 60, .16); font-size: 14px; }
.err button { margin-top: 6px; padding: 6px 12px; border-radius: 8px; background: var(--surface); font-weight: 600; }

.wk { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; }
.wk button { min-width: 44px; padding: 8px 12px; border-radius: 10px; background: var(--surface); }
.wk .rng { font-weight: 600; }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 10px; }
.day { padding: 8px 0 6px; border-radius: 12px; text-align: center; line-height: 1.15; }
.day small { display: block; color: var(--hint); font-size: 12px; }
.day b { font-size: 16px; }
.day.today small { color: var(--accent-text); font-weight: 700; }
.day .dot { display: block; width: 5px; height: 5px; margin: 3px auto 0; border-radius: 50%; background: var(--accent); visibility: hidden; }
.day.has .dot { visibility: visible; }
.day[aria-pressed="true"] { background: var(--accent); color: #fff; }
.day[aria-pressed="true"] small { color: rgba(255, 255, 255, .88); }
.day[aria-pressed="true"] .dot { background: #fff; }
.tolink { display: block; margin: 10px auto 0; padding: 6px 12px; border-radius: 10px; color: var(--accent-text); font-weight: 600; }

.status { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; color: var(--hint); font-size: 13px; }
.status button { padding: 6px 10px; border-radius: 8px; background: var(--surface); color: var(--text); }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr); padding-bottom: env(safe-area-inset-bottom); background: var(--bg); border-top: 1px solid var(--line); }
.tabs button { padding: 14px 0; color: var(--hint); font-size: 15px; }
.tabs button[aria-pressed="true"] { color: var(--accent-text); font-weight: 600; box-shadow: inset 0 2px 0 var(--accent); }


[hidden] { display: none !important; }
.lesson[data-act="open"] { cursor: pointer; }
.lesson.isdone { opacity: .55; }
.hw { display: flex; align-items: flex-start; gap: 6px; margin-top: 6px; padding: 5px 8px; border-radius: 8px; background: var(--accent-soft); font-size: 14px; }
.hw .rd { flex: none; width: 8px; height: 8px; margin-top: 6px; border-radius: 50%; background: #e5484d; }
.okline { color: var(--accent-text); font-weight: 600; }
.hwitem { display: block; width: 100%; margin-top: 8px; padding: 10px 12px; border-radius: 12px; background: var(--surface); text-align: left; }
.hwitem b { display: block; font-size: 14px; }
.hwitem span { display: block; margin-top: 2px; font-size: 14px; color: var(--hint); }
.note { margin-top: 10px; padding: 8px 12px; border-radius: 12px; background: var(--surface); color: var(--hint); font-size: 13px; }
.note.warn { background: rgba(229, 160, 40, .18); color: var(--text); }
.ro { margin-top: 10px; color: var(--hint); font-size: 13px; text-align: center; }

.sh-bg { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, .45); }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 88vh; overflow: auto; padding: 16px 16px calc(env(safe-area-inset-bottom) + 16px); background: var(--bg); border-radius: 20px 20px 0 0; }
.sheet .ttl { font-size: 17px; }
.sheet label { display: block; margin-top: 14px; font-size: 13px; font-weight: 600; color: var(--hint); }
.sheet label .cnt { float: right; font-weight: 400; }
.sheet textarea { display: block; width: 100%; margin-top: 6px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--text); font: inherit; resize: none; }
.sheet textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.sheet .view { margin-top: 6px; padding: 10px 12px; border-radius: 12px; background: var(--surface); white-space: pre-wrap; }
.btns { display: grid; gap: 8px; margin-top: 14px; }
.btn { padding: 12px; border-radius: 12px; background: var(--surface); text-align: center; font-weight: 600; }
.btn.primary { background: var(--accent); color: #fff; }
.btn.danger { color: #e5484d; }

.toast { position: fixed; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 64px); z-index: 30; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; border-radius: 14px; background: #23272e; color: #fff; font-size: 14px; }
.toast button { padding: 6px 10px; border-radius: 8px; background: rgba(255, 255, 255, .16); font-weight: 600; white-space: nowrap; }

.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 10px; }
.cal .wd { padding: 4px 0; text-align: center; color: var(--hint); font-size: 12px; }
.cell { position: relative; display: flex; align-items: center; justify-content: center; aspect-ratio: 1 / 1; border-radius: 12px; font-size: 15px; font-variant-numeric: tabular-nums; }
.cell.out { visibility: hidden; }
.cell.has { background: var(--accent-soft); font-weight: 600; }
.cell.today { box-shadow: inset 0 0 0 2px var(--accent); }
.cell[aria-pressed="true"] { background: var(--accent); color: #fff; }
.cell .rd { position: absolute; top: 5px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: #e5484d; }
.q { display: block; width: 100%; margin-top: 14px; padding: 11px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--text); font: inherit; }
.q:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { padding: 6px 12px; border-radius: 999px; background: var(--surface); font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; box-shadow: inset 0 0 0 1.5px var(--accent); }
.count { margin: 14px 2px 0; color: var(--hint); font-size: 13px; }
.more { display: block; margin: 12px auto 0; padding: 8px 16px; border-radius: 10px; background: var(--surface); font-weight: 600; }

.lesson.colored { box-shadow: inset 5px 0 0 var(--c); padding-left: 16px; }
.hwitem.colored { box-shadow: inset 5px 0 0 var(--c); padding-left: 16px; }
.swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; margin-top: 8px; }
.sw { position: relative; aspect-ratio: 1 / 1; min-height: 34px; border-radius: 50%; background: var(--c); }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--text); }
.sw[aria-pressed="true"]::after { content: "✓"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; text-shadow: 0 0 3px rgba(0, 0, 0, .55); }
.sw.none { background: var(--surface); color: var(--hint); font-size: 18px; }
.sw.none::before { content: "×"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.sw.none[aria-pressed="true"]::after { content: ""; }

.sheet textarea { font-size: 16px; font-weight: 400; }
.in { display: block; width: 100%; margin-top: 6px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--text); font-family: inherit; font-size: 16px; font-weight: 400; }
.in:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sheet .err { margin-top: 12px; }
.badge.k-own { background: transparent; color: var(--hint); box-shadow: inset 0 0 0 1px var(--line); }
.fab { position: fixed; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 72px); z-index: 10; width: 52px; height: 52px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 28px; line-height: 1; box-shadow: 0 4px 14px rgba(0, 0, 0, .28); }

.stat { margin-top: 8px; padding: 14px; border-radius: 16px; background: var(--surface); }
.stat .big { font-size: 34px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; color: var(--accent-text); }
.bar.thick { height: 10px; margin-top: 10px; }
.subj, .dayrow { margin-top: 8px; padding: 12px; border-radius: 14px; background: var(--surface); }
.subj.colored { box-shadow: inset 5px 0 0 var(--c); padding-left: 16px; }
.rl { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.rl b { font-weight: 600; }
.rl span { flex: none; color: var(--hint); font-variant-numeric: tabular-nums; }
.subj .bar, .dayrow .bar { margin-top: 8px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.tile { padding: 12px; border-radius: 14px; background: var(--surface); }
.tile b { display: block; font-size: 26px; font-variant-numeric: tabular-nums; }
.tile span { color: var(--hint); font-size: 13px; }
.hwitem .due { color: var(--accent-text); font-weight: 600; }

.top { display: flex; gap: 8px; align-items: stretch; }
.top .switch { flex: 1; }
.themebtn { padding: 0 14px; border-radius: 14px; background: var(--surface); font-size: 14px; }
.partner { display: flex; gap: 10px; margin-top: 12px; padding: 12px; border-radius: 16px; background: var(--surface); }
.partner .pd { flex: none; width: 10px; height: 10px; margin-top: 6px; border-radius: 50%; background: var(--pa); }
.partner .ptl { font-weight: 600; }
.joint { margin-top: 8px; padding: 12px; border-radius: 14px; background: var(--accent-soft); }
.joint .cap { margin-bottom: 6px; font-size: 13px; font-weight: 600; color: var(--accent-text); }
.win { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; font-variant-numeric: tabular-nums; }
.win span { color: var(--hint); }

.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 12px; padding: 3px; border-radius: 12px; background: var(--surface); }
.seg button { padding: 8px; border-radius: 9px; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--bg); font-weight: 600; box-shadow: 0 1px 3px rgba(0, 0, 0, .15); }

.chg { margin-top: 12px; padding: 12px; border-radius: 16px; background: rgba(229, 160, 40, .18); }
.chg .cap { margin-bottom: 4px; font-weight: 600; }
.chgitem { padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px; }
.chgitem:first-of-type { border-top: 0; }
.chgitem.new::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: #e5484d; }
.chg .btn { margin-top: 8px; width: 100%; }
.badge.k-chg { background: #b96f00; }

.t span { display: block; }
.t .pn { margin-top: 2px; font-size: 12px; }
.subjrow { display: block; margin-top: 8px; padding: 12px; border-radius: 14px; background: var(--surface); cursor: pointer; }
.subjrow.colored { box-shadow: inset 5px 0 0 var(--c); padding-left: 16px; }
.subjrow .sname { min-width: 0; font-weight: 600; }
.subjrow .when { flex: none; text-align: right; }
.subjrow .when b { display: block; font-weight: 600; }
.subjrow .when span { display: block; font-size: 13px; }
.subjrow .hw { margin-top: 6px; }

@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="toast" class="toast" hidden></div>

<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    try { tg.ready(); tg.expand(); } catch (e) {}
    document.documentElement.dataset.scheme = tg.colorScheme || 'light';
  }

  // ---------- хранилище ----------
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };
  const readJSON = (k, d) => { try { const v = JSON.parse(store.get(k)); return v == null ? d : v; } catch (e) { return d; } };
  const emptyDoc = () => ({ hw: {}, done: {}, colors: {}, custom: {}, prefs: {} });
  const normDoc = (d) => ({ hw: (d && d.hw) || {}, done: (d && d.done) || {}, colors: (d && d.colors) || {}, custom: (d && d.custom) || {}, prefs: (d && d.prefs) || {} });

  // ---------- тема: Как в Telegram / Светлая / Тёмная ----------
  const THEME_BG = { light: '#ffffff', dark: '#17181c' };
  const themePref = () => { const t = store.get('parket.theme'); return t === 'light' || t === 'dark' ? t : 'auto'; };
  function applyTheme() {
    const pref = themePref();
    const root = document.documentElement;
    let scheme;
    if (pref === 'auto') {
      delete root.dataset.theme;
      scheme = (tg && tg.colorScheme) || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } else {
      root.dataset.theme = pref;
      scheme = pref;
    }
    root.dataset.scheme = scheme;
    if (tg) {
      try {
        const c = pref === 'auto' ? 'bg_color' : THEME_BG[pref];
        tg.setHeaderColor(c);
        tg.setBackgroundColor(c);
        if (tg.setBottomBarColor && pref !== 'auto') tg.setBottomBarColor(c);
      } catch (e) { /* старый клиент */ }
    }
  }
  applyTheme();
  if (tg && tg.onEvent) { try { tg.onEvent('themeChanged', () => { if (themePref() === 'auto') applyTheme(); }); } catch (e) {} }

  const cachedState = readJSON('parket.state', null);
  const pending = readJSON('parket.pending', {});
  pending.hw = pending.hw || {};
  pending.done = pending.done || {};
  pending.colors = pending.colors || {};
  pending.custom = pending.custom || {};
  pending.prefs = pending.prefs || {};

  const state = {
    who: cachedState && cachedState.who ? cachedState.who : null, // чей это телефон: 'me' | 'her'
    docs: cachedState && cachedState.docs ? { me: normDoc(cachedState.docs.me), her: normDoc(cachedState.docs.her) } : { me: emptyDoc(), her: emptyDoc() },
    profile: (cachedState && cachedState.who) || (store.get('parket.profile') === 'her' ? 'her' : 'me'),
    userPicked: false,
    tab: ['week', 'month', 'subjects', 'search', 'stats'].includes(store.get('parket.tab')) ? store.get('parket.tab') : 'today',
    data: {},        // profile -> { lessons, group, fetchedAt, errors }
    err: null,
    loading: false,
    sync: { code: 'idle' },
    changes: readJSON('parket.changes', { me: [], her: [] }),   // журнал изменений расписания
    weekOf: null,    // понедельник показанной недели
    selDate: null,   // выбранный день в «Неделе»
    month: null,     // показанный месяц 'YYYY-MM'
    calSel: null,    // выбранный день в «Месяце»
    calMode: ['month', 'subjects'].includes(store.get('parket.calmode')) ? store.get('parket.calmode') : 'week', // масштаб вкладки «Календарь»
    q: '', kind: 'all', onlyHw: false, past: false, limit: 50, // поиск
  };
  const LABEL = { me: 'Кирилл', her: 'Маша' };
  const FREE = { me: 'свободен', her: 'свободна' };
  const otherOf = (p) => (p === 'me' ? 'her' : 'me');
  const readCache = (p) => { try { return JSON.parse(store.get('parket.cache.' + p)); } catch (e) { return null; } };
  const writeCache = (p, d) => store.set('parket.cache.' + p, JSON.stringify(d));

  // ---------- время (расписание вуза идёт по Москве) ----------
  const pad = (n) => String(n).padStart(2, '0');
  function nowMsk() {
    return new Intl.DateTimeFormat('sv-SE', {
      timeZone: 'Europe/Moscow', year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23',
    }).format(new Date()).replace(' ', 'T');
  }
  const nowStr = () => window.__NOW || nowMsk();          // __NOW нужен только для тестов
  const ms = (s) => Date.parse(s + 'Z');
  const WD = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
  const MON = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  const MON_N = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
  const MON_S = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
  const dOf = (s) => new Date(s + 'T00:00:00Z');
  const dow = (s) => dOf(s).getUTCDay();
  const addDays = (s, n) => new Date(dOf(s).getTime() + n * 864e5).toISOString().slice(0, 10);
  const mondayOf = (s) => addDays(s, -((dow(s) + 6) % 7));
  const human = (s) => { const d = dOf(s); return d.getUTCDate() + ' ' + MON[d.getUTCMonth()]; };
  const dur = (m) => (m < 60 ? m + ' мин' : Math.floor(m / 60) + ' ч' + (m % 60 ? ' ' + (m % 60) + ' мин' : ''));
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // ---------- цветовые метки предметов (16) ----------
  const PALETTE = [
    ['#e5484d', 'красный'], ['#f08a24', 'оранжевый'], ['#e0b000', 'янтарный'], ['#8fbf2a', 'лаймовый'],
    ['#2fa35a', 'зелёный'], ['#12a594', 'изумрудный'], ['#16b0c9', 'бирюзовый'], ['#3b9cf0', 'голубой'],
    ['#3e63dd', 'синий'], ['#6e56cf', 'индиго'], ['#9b51e0', 'фиолетовый'], ['#c94fc0', 'пурпурный'],
    ['#e5508f', 'розовый'], ['#b5654a', 'терракотовый'], ['#7b8794', 'серый'], ['#c2a878', 'песочный'],
  ];
  const colorOf = (sk) => { const i = curDoc().colors[sk]; return Number.isInteger(i) && PALETTE[i] ? PALETTE[i][0] : null; };

  // ---------- ключи: ДЗ привязано к предмету, «пройдена» к конкретной паре ----------
  const skey = (l) => l.subject.trim().toLowerCase().replace(/\s+/g, ' ');
  const lkey = (l) => l.date + '|' + l.start + '|' + skey(l);
  const curDoc = () => state.docs[state.profile] || emptyDoc();
  const canEdit = () => !!state.who && state.who === state.profile;
  const isDone = (l) => !!curDoc().done[lkey(l)];


  // ---------- свои пары: превращаем записи в обычные карточки ----------
  function expandCustom(id, c) {
    const skip = new Set(c.skip || []);
    const dates = [];
    if (c.until) { for (let d = c.date, n = 0; d <= c.until && n <= 60; d = addDays(d, 7), n++) dates.push(d); } else dates.push(c.date);
    return dates.filter((d) => !skip.has(d)).map((d) => ({
      id: 'c:' + id + ':' + d, cid: id, custom: true, date: d, start: c.start, end: c.end,
      startAt: d + 'T' + c.start + ':00', endAt: d + 'T' + c.end + ':00', num: 0,
      kind: c.kind || null, subject: c.title, title: c.title, teacher: c.teacher || '', room: c.room || '',
      color: null, subgroup: 0, weekType: 0, replaced: false,
    }));
  }
  function allLessons(profile) {
    const p = profile || state.profile;
    const base = (state.data[p] || {}).lessons || [];
    const doc = state.docs[p];
    const extra = [];
    if (doc && doc.custom) for (const [id, c] of Object.entries(doc.custom)) extra.push(...expandCustom(id, c));
    if (!extra.length) return base;
    return base.concat(extra).sort((a, b) => (a.startAt < b.startAt ? -1 : a.startAt > b.startAt ? 1 : 0));
  }


  // ---------- журнал изменений расписания ----------
  const GEN = { me: 'Кирилла', her: 'Маши' };
  const changesOf = (p) => (state.changes && state.changes[p]) || [];
  const seenOf = (p) => { const d = state.who && state.docs[state.who]; return (d && d.prefs && d.prefs.seen && d.prefs.seen[p]) || ''; };
  const relevantChanges = (p) => {
    const today = nowStr().slice(0, 10);
    return changesOf(p).filter((e) => e.type === 'published' || !e.date || e.date >= today);
  };
  const unseenChanges = (p) => relevantChanges(p).filter((e) => e.t > seenOf(p));

  function changeFor(l) {
    if (l.custom) return null;
    return unseenChanges(state.profile).find((x) => x.lid === String(l.id) && (x.type === 'moved' || x.type === 'changed' || x.type === 'added')) || null;
  }

  function changesBlock() {
    const p = state.profile;
    const list = relevantChanges(p);
    if (!list.length || !state.who) return '';
    const seen = seenOf(p);
    const unseen = list.filter((e) => e.t > seen);
    const row = (e) => `<div class="chgitem${e.t > seen ? ' new' : ''}">${esc(e.text)}</div>`;
    if (!unseen.length) {
      return `<details class="past"><summary>Прошлые изменения: ${list.length}</summary>${list.slice(0, 10).map(row).join('')}</details>`;
    }
    const who = p === state.who ? 'Что изменилось' : 'Что изменилось у ' + GEN[p];
    return `<section class="chg"><div class="cap">${who}: новых ${unseen.length}</div>` +
      unseen.slice(0, 8).map(row).join('') +
      (unseen.length > 8 ? `<div class="meta">и ещё ${unseen.length - 8}</div>` : '') +
      '<button class="btn" data-act="chg-read">Прочитано</button></section>';
  }

  // ---------- нумерация пар: у каждого своя сетка (копия в lib/slots.js) ----------
  const SLOTS = {
    me: [['08:00', '09:30'], ['09:40', '11:10'], ['11:50', '13:20'], ['13:30', '15:00'], ['15:40', '17:10'], ['17:20', '18:50']],
    her: [['08:30', '10:05'], ['10:15', '11:50'], ['12:00', '13:35'], ['14:15', '15:50'], ['16:00', '17:35']],
  };
  function pairNo(l, profile) {
    const i = (SLOTS[profile || state.profile] || []).findIndex((sl) => sl[0] === l.start);
    if (i >= 0) return i + 1;
    return !l.custom && l.num > 0 ? l.num : 0;   // не по сетке: номер из расписания вуза, у своих пар без номера
  }
  const plural = (n, f) => { const a = n % 100; const b = n % 10; return f[a > 10 && a < 20 ? 2 : b === 1 ? 0 : b >= 2 && b <= 4 ? 1 : 2]; };
  const KIND_CLS = { 'лек': 'lec', 'пр': 'pr', 'лаб': 'lab' };

  // ---------- карточка пары ----------
  function lessonHTML(l) {
    const kind = { 'лек': 'lec', 'пр': 'pr', 'лаб': 'lab' }[l.kind] || 'other';
    const badge = l.kind ? `<span class="badge k-${kind}">${esc(l.kind)}</span>` : '';
    const doc = curDoc();
    const hw = doc.hw[skey(l)];
    let meta = '';
    if (l.teacher) meta += `<div class="meta">${esc(l.teacher)}</div>`;
    if (l.room) {
      const short = l.room.includes(' - ') ? l.room.split(' - ')[0] : l.room;
      meta += `<div class="meta" title="${esc(l.room)}">ауд. ${esc(short)}</div>`;
    }
    if (l.variants && l.variants.length) {
      const v = l.variants;
      meta += `<details><summary>Подгруппы ${v[0].n}–${v[v.length - 1].n}</summary><div class="vars">` +
        v.map((x) => `<div>п/г ${x.n}: ${esc(x.teacher)}, ${esc(x.room)}</div>`).join('') + '</div></details>';
    }
    if (hw && !hw.done) meta += `<div class="hw"><i class="rd"></i><span>${esc(hw.text)}</span></div>`;
    const done = !!doc.done[lkey(l)];
    if (done) meta += '<div class="meta okline">✓ пройдена</div>';
    const col = colorOf(skey(l));
    const chg = changeFor(l);
    const chgBadge = chg ? `<span class="badge k-chg" title="${esc(chg.text)}">${{ moved: 'перенесена', changed: 'изменено', added: 'новая' }[chg.type]}</span>` : '';
    if (chg && chg.type === 'moved' && chg.was) meta += `<div class="meta">Было: ${WD[dow(chg.was.d)]}, ${human(chg.was.d)}, ${esc(chg.was.s)}</div>`;
    return `<article class="lesson${done ? ' isdone' : ''}${col ? ' colored' : ''}"${col ? ` style="--c:${col}"` : ''} tabindex="0" role="button" data-act="open" data-k="${esc(lkey(l))}">` +
      `<div class="t"><b>${esc(l.start)}</b><span>${esc(l.end)}</span>${pairNo(l) ? `<span class="pn">${pairNo(l)} пара</span>` : ''}</div>` +
      `<div><div class="ttl">${badge}${chgBadge}${l.custom ? '<span class="badge k-own">своя</span>' : ''}${esc(l.subject)}</div>${meta}</div></article>`;
  }

  function hwListHTML() {
    const items = Object.entries(curDoc().hw).filter(([, v]) => !v.done).sort((a, b) => (b[1].t || 0) - (a[1].t || 0));
    if (!items.length) return '';
    return '<h2>Активное ДЗ</h2>' + items.map(([k, v]) =>
      `<button class="hwitem${colorOf(k) ? ' colored' : ''}"${colorOf(k) ? ` style="--c:${colorOf(k)}"` : ''} data-act="hw" data-sk="${esc(k)}"><b>${esc(v.name || k)}</b><span>${esc(v.text)}</span></button>`).join('');
  }


  // ---------- партнёр: что делает сейчас, общие окна ----------
  const DAY_FROM = 8 * 60, DAY_TO = 22 * 60, MIN_WINDOW = 60;
  const fmtMin = (m) => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
  const roomBit = (l) => (l.room ? ', ауд. ' + (l.room.includes(' - ') ? l.room.split(' - ')[0] : l.room) : '');

  function freeOf(profile, date) {
    const busy = allLessons(profile).filter((l) => l.date === date).map((l) => [toMin(l.start), toMin(l.end)]).sort((a, b) => a[0] - b[0]);
    const free = [];
    let cur = DAY_FROM;
    for (const [st, en] of busy) {
      if (cur >= DAY_TO) break;
      if (st > cur) free.push([cur, Math.min(st, DAY_TO)]);
      cur = Math.max(cur, en);
    }
    if (cur < DAY_TO) free.push([cur, DAY_TO]);
    return free;
  }

  function jointWindows(date) {
    if (!state.data.me || !state.data.her) return null;
    const a = freeOf('me', date);
    const b = freeOf('her', date);
    const now = nowStr();
    const from = date === now.slice(0, 10) ? Math.max(DAY_FROM, toMin(now.slice(11, 16))) : DAY_FROM;
    const out = [];
    for (const [s1, e1] of a) {
      for (const [s2, e2] of b) {
        const st = Math.max(s1, s2, from);
        const en = Math.min(e1, e2);
        if (en - st >= MIN_WINDOW) out.push({ from: st, to: en });
      }
    }
    return out.sort((x, y) => x.from - y.from);
  }

  function jointBlock(date) {
    const w = jointWindows(date);
    if (w === null) return '';
    const body = w.length
      ? w.map((x) => `<div class="win"><b>${fmtMin(x.from)}–${fmtMin(x.to)}</b><span>${dur(x.to - x.from)}</span></div>`).join('')
      : '<div class="meta">Общих окон нет.</div>';
    return `<section class="joint"><div class="cap">Свободны вместе (окна от 1 ч), время московское</div>${body}</section>`;
  }

  function partnerCardHTML() {
    if (!state.who || state.profile !== state.who) return '';
    const pp = otherOf(state.who);
    if (!state.data[pp]) return '';
    const now = nowStr();
    const today = now.slice(0, 10);
    const day = allLessons(pp).filter((l) => l.date === today);
    const name = LABEL[pp];
    const cur = day.find((l) => l.startAt <= now && now < l.endAt);
    const next = day.find((l) => l.startAt > now);
    let head;
    let sub = '';
    if (cur) {
      head = `${name} на паре до ${cur.end}`;
      sub = cur.subject + roomBit(cur);
    } else if (next) {
      head = `${name} ${FREE[pp]} до ${next.start}`;
      sub = 'Дальше: ' + next.subject + roomBit(next);
    } else if (day.length) {
      head = `${name} ${FREE[pp]}, пары закончились в ${day.reduce((m, l) => (l.end > m ? l.end : m), '00:00')}`;
    } else {
      head = `${name}: сегодня пар нет`;
    }
    const pu = unseenChanges(pp).length;
    const chgLine = pu ? `В расписании ${GEN[pp]} есть изменения: ${pu}` : '';
    const w = jointWindows(today);
    let joint = '';
    if (w) joint = w.length ? 'Вместе свободны: ' + w.slice(0, 3).map((x) => fmtMin(x.from) + '–' + fmtMin(x.to)).join(', ') : 'Общих окон сегодня больше нет';
    return `<section class="partner" style="--pa:${pp === 'her' ? '#c93d63' : '#1f6fd1'}"><i class="pd"></i><div>` +
      `<div class="ptl">${esc(head)}</div>${sub ? `<div class="meta">${esc(sub)}</div>` : ''}${joint ? `<div class="meta">${esc(joint)}</div>` : ''}${chgLine ? `<div class="meta">${esc(chgLine)}</div>` : ''}</div></section>`;
  }

  // ---------- экран «Сегодня» ----------
  function viewToday(all) {
    const now = nowStr();
    const today = now.slice(0, 10);
    const day = all.filter((l) => l.date === today);
    const cur = day.find((l) => l.startAt <= now && now < l.endAt && !isDone(l));
    const upcoming = day.filter((l) => l.startAt > now && !isDone(l));
    const past = day.filter((l) => l.endAt <= now || isDone(l));
    let html = changesBlock() + partnerCardHTML();
    if (cur) {
      const a = ms(cur.startAt), b = ms(cur.endAt), n = ms(now);
      const pct = Math.min(100, Math.max(0, ((n - a) / (b - a)) * 100));
      html += `<section class="up"><div class="cap">Идёт сейчас, осталось ${dur(Math.ceil((b - n) / 60000))}</div>` +
        lessonHTML(cur) + `<div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div></section>`;
    } else if (upcoming.length) {
      const diff = Math.ceil((ms(upcoming[0].startAt) - ms(now)) / 60000);
      html += `<section class="up"><div class="cap">Следующая пара ${diff <= 1 ? 'сейчас начнётся' : 'через ' + dur(diff)}</div>` +
        lessonHTML(upcoming[0]) + '</section>';
    }
    const rest = cur ? upcoming : upcoming.slice(1);
    if (rest.length) html += '<h2>Потом сегодня</h2>' + rest.map(lessonHTML).join('');
    if (!cur && !upcoming.length) {
      const nxt = all.find((l) => l.startAt > now && !isDone(l));
      html += `<div class="empty"><div class="ttl">${day.length ? 'На сегодня всё' : 'Сегодня пар нет'}</div>` +
        (nxt
          ? `<div class="meta">Дальше: ${WD[dow(nxt.date)]}, ${human(nxt.date)}, ${esc(nxt.start)}, ${esc(nxt.subject)}</div>`
          : '<div class="meta">Больше пар в расписании нет.</div>') + '</div>';
    }
    html += hwListHTML();
    if (past.length) html += `<details class="past"><summary>Прошло сегодня: ${past.length}</summary>${past.map(lessonHTML).join('')}</details>`;
    return html;
  }

  // ---------- «Календарь»: переключатель масштаба ----------
  function calSeg() {
    return '<div class="seg" role="group" aria-label="Масштаб календаря">' +
      [['week', 'Неделя'], ['month', 'Месяц'], ['subjects', 'Предметы']].map(([k, t]) => `<button data-act="tab" data-tab="${k}" aria-pressed="${state.tab === k}">${t}</button>`).join('') + '</div>';
  }

  // ---------- экран «Неделя» ----------
  function viewWeek(all) {
    const today = nowStr().slice(0, 10);
    if (!state.weekOf) state.weekOf = mondayOf(state.selDate || today);
    const days = Array.from({ length: 7 }, (_, i) => addDays(state.weekOf, i));
    if (!state.selDate || !days.includes(state.selDate)) state.selDate = days.includes(today) ? today : days[0];
    const has = new Set(all.map((l) => l.date));
    const a = dOf(days[0]), b = dOf(days[6]);
    const rng = a.getUTCMonth() === b.getUTCMonth()
      ? `${a.getUTCDate()}–${b.getUTCDate()} ${MON[a.getUTCMonth()]}`
      : `${a.getUTCDate()} ${MON_S[a.getUTCMonth()]} – ${b.getUTCDate()} ${MON_S[b.getUTCMonth()]}`;
    let html = calSeg() + `<div class="wk"><button data-act="prev" aria-label="Предыдущая неделя">‹</button><span class="rng">${rng}</span>` +
      '<button data-act="next" aria-label="Следующая неделя">›</button></div><div class="days">';
    for (const d of days) {
      html += `<button class="day${d === today ? ' today' : ''}${has.has(d) ? ' has' : ''}" data-act="day" data-date="${d}" aria-pressed="${d === state.selDate}">` +
        `<small>${WD[dow(d)]}</small><b>${dOf(d).getUTCDate()}</b><i class="dot"></i></button>`;
    }
    html += '</div>';
    if (!days.includes(today)) html += '<button class="tolink" data-act="today">К сегодняшнему дню</button>';
    const list = all.filter((l) => l.date === state.selDate);
    html += `<h2>${WD[dow(state.selDate)]}, ${human(state.selDate)}</h2>` + jointBlock(state.selDate);
    html += list.length ? list.map(lessonHTML).join('') : '<div class="empty"><div class="ttl">В этот день пар нет</div></div>';
    return html;
  }


  // ---------- экран «Месяц» ----------
  // Красная точка ставится на день, к которому нужно ДЗ: ближайшая будущая пара предмета с активным ДЗ.
  function hwDueDays(all) {
    const now = nowStr();
    const due = new Set();
    for (const [sk, v] of Object.entries(curDoc().hw)) {
      if (v.done) continue;
      const nx = all.find((l) => l.startAt > now && skey(l) === sk && !isDone(l));
      if (nx) due.add(nx.date);
    }
    return due;
  }

  function viewMonth(all) {
    const today = nowStr().slice(0, 10);
    if (!state.month) state.month = today.slice(0, 7);
    const [y, m] = state.month.split('-').map(Number);
    const lead = (dow(state.month + '-01') + 6) % 7;
    const dim = new Date(Date.UTC(y, m, 0)).getUTCDate();
    const count = new Map();
    for (const l of all) if (l.date.slice(0, 7) === state.month) count.set(l.date, (count.get(l.date) || 0) + 1);
    const due = hwDueDays(all);
    if (state.calSel && state.calSel.slice(0, 7) !== state.month) state.calSel = null;
    if (!state.calSel && today.slice(0, 7) === state.month) state.calSel = today;
    let html = calSeg() + `<div class="wk"><button data-act="mprev" aria-label="Предыдущий месяц">‹</button><span class="rng">${MON_N[m - 1]} ${y}</span>` +
      '<button data-act="mnext" aria-label="Следующий месяц">›</button></div><div class="cal">';
    ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].forEach((w) => { html += `<div class="wd">${w}</div>`; });
    for (let i = 0; i < lead; i++) html += '<span class="cell out"></span>';
    for (let d = 1; d <= dim; d++) {
      const ds = `${state.month}-${pad(d)}`;
      const n = count.get(ds) || 0;
      const dueHere = due.has(ds);
      const label = `${d} ${MON[m - 1]}, ${n ? 'пар: ' + n : 'пар нет'}${dueHere ? ', нужно ДЗ' : ''}`;
      html += `<button class="cell${n ? ' has' : ''}${ds === today ? ' today' : ''}" data-act="cell" data-date="${ds}" aria-pressed="${ds === state.calSel}" aria-label="${label}">` +
        `${d}${dueHere ? '<i class="rd"></i>' : ''}</button>`;
    }
    html += '</div>';
    if (state.month !== today.slice(0, 7)) html += '<button class="tolink" data-act="mtoday">К текущему месяцу</button>';
    html += '<div class="ro">Красная точка: к этому дню нужно ДЗ</div>';
    if (state.calSel) {
      const list = all.filter((l) => l.date === state.calSel);
      html += `<h2>${WD[dow(state.calSel)]}, ${human(state.calSel)}</h2>` + jointBlock(state.calSel);
      html += list.length ? list.map(lessonHTML).join('') : '<div class="empty"><div class="ttl">В этот день пар нет</div></div>';
    } else {
      html += '<h2>Выбери день</h2>';
    }
    return html;
  }

  // ---------- экран «Поиск» ----------
  const norm = (s) => String(s || '').toLowerCase().replace(/ё/g, 'е');
  const haystack = (l) => norm([l.subject, l.teacher, l.room, l.kind]
    .concat((l.variants || []).reduce((a, v) => a.concat([v.teacher, v.room]), [])).join(' '));

  function resultsHTML(all) {
    const today = nowStr().slice(0, 10);
    const doc = curDoc();
    const toks = norm(state.q).split(/\s+/).filter(Boolean);
    const list = all.filter((l) => {
      if (!state.past && l.date < today) return false;
      if (state.kind !== 'all' && l.kind !== state.kind) return false;
      if (state.onlyHw) { const h = doc.hw[skey(l)]; if (!h || h.done) return false; }
      const hay = haystack(l);
      return toks.every((t) => hay.includes(t));
    });
    if (!list.length) return '<div class="empty"><div class="ttl">Ничего не найдено</div><div class="meta">Попробуй другое слово или сними фильтры.</div></div>';
    const shown = list.slice(0, state.limit);
    let html = `<div class="count">Найдено пар: ${list.length}</div>`;
    let lastDate = '';
    for (const l of shown) {
      if (l.date !== lastDate) { html += `<h2>${WD[dow(l.date)]}, ${human(l.date)}</h2>`; lastDate = l.date; }
      html += lessonHTML(l);
    }
    if (list.length > shown.length) html += `<button class="more" data-act="more">Показать ещё</button>`;
    return html;
  }

  function viewSearch(all) {
    const kinds = [['all', 'Все'], ['лек', 'Лекции'], ['пр', 'Практики'], ['лаб', 'Лабы']];
    return `<input id="q" class="q" type="search" placeholder="Предмет, преподаватель, аудитория" autocomplete="off" enterkeyhint="search" value="${esc(state.q)}">` +
      '<div class="chips">' +
      kinds.map(([v, t]) => `<button class="chip" data-act="kind" data-v="${v}" aria-pressed="${state.kind === v}">${t}</button>`).join('') +
      `<button class="chip" data-act="tgl" data-v="onlyHw" aria-pressed="${state.onlyHw}">С ДЗ</button>` +
      `<button class="chip" data-act="tgl" data-v="past" aria-pressed="${state.past}">И прошедшие</button></div>` +
      `<div id="results">${resultsHTML(all)}</div>`;
  }



  // ---------- «Предметы»: что на носу, по ближайшему занятию ----------
  function viewSubjects(all) {
    const now = nowStr();
    const today = now.slice(0, 10);
    const doc = curDoc();
    const subj = new Map();
    for (const l of all) {
      const k = skey(l);
      if (!subj.has(k)) subj.set(k, { k, name: l.subject, next: null, left: 0 });
      const x = subj.get(k);
      if (l.endAt > now && !isDone(l)) { x.left += 1; if (!x.next) x.next = l; }
    }
    if (!subj.size) return calSeg() + '<div class="empty"><div class="ttl">Расписание пока пустое</div></div>';
    const list = [...subj.values()];
    const byName = (a, b) => a.name.localeCompare(b.name, 'ru');
    const soon = list.filter((x) => x.next).sort((a, b) => (a.next.startAt < b.next.startAt ? -1 : a.next.startAt > b.next.startAt ? 1 : byName(a, b)));
    const gone = list.filter((x) => !x.next).sort(byName);
    const dayN = (d) => Math.round((dOf(d) - dOf(today)) / 864e5);
    let html = calSeg();
    if (!soon.length) html += '<div class="empty"><div class="ttl">Ближайших занятий нет</div></div>';
    else {
      html += `<h2>Ближайшие занятия по предметам: ${soon.length}</h2>` + soon.map((x) => {
        const l = x.next;
        const n = dayN(l.date);
        const top = n === 0 ? 'Сегодня' : n === 1 ? 'Завтра' : `${WD[dow(l.date)]}, ${human(l.date)}`;
        const sub = n === 0 && l.startAt <= now ? 'идёт сейчас' : n >= 2 ? `через ${n} ${plural(n, ['день', 'дня', 'дней'])}` : '';
        const kind = l.kind ? `<span class="badge k-${KIND_CLS[l.kind] || 'other'}">${esc(l.kind)}</span>` : '';
        const chg = changeFor(l);
        const chgB = chg ? `<span class="badge k-chg">${{ moved: 'перенесена', changed: 'изменено', added: 'новая' }[chg.type]}</span>` : '';
        const own = l.custom ? '<span class="badge k-own">своя</span>' : '';
        const col = colorOf(x.k);
        const hw = doc.hw[x.k];
        const pn = pairNo(l);
        return `<article class="subjrow${col ? ' colored' : ''}"${col ? ` style="--c:${col}"` : ''} tabindex="0" role="button" data-act="open" data-k="${esc(lkey(l))}">` +
          `<div class="rl"><div class="sname">${kind}${chgB}${own}${esc(x.name)}</div><div class="when"><b>${top}</b>${sub ? `<span>${sub}</span>` : ''}</div></div>` +
          `<div class="meta">${pn ? pn + ' пара, ' : ''}${esc(l.start)}–${esc(l.end)}${esc(roomBit(l))}</div>` +
          (hw && !hw.done ? `<div class="hw"><i class="rd"></i><span>${esc(hw.text)}</span></div>` : '') +
          `<div class="meta">Осталось занятий: ${x.left}</div></article>`;
      }).join('');
    }
    if (gone.length) {
      html += `<details class="past"><summary>Занятий больше нет: ${gone.length}</summary>` + gone.map((x) => {
        const col = colorOf(x.k);
        return `<div class="subj${col ? ' colored' : ''}"${col ? ` style="--c:${col}"` : ''}><div class="rl"><b>${esc(x.name)}</b></div></div>`;
      }).join('') + '</details>';
    }
    return html;
  }

  // ---------- экран «Итоги» ----------
  const toMin = (t) => Number(t.slice(0, 2)) * 60 + Number(t.slice(3, 5));

  function viewStats(all) {
    if (!all.length) return '<div class="empty"><div class="ttl">Пока нет пар для статистики</div></div>';
    const now = nowStr();
    const today = now.slice(0, 10);
    const doc = curDoc();
    const total = all.length;
    const passed = all.filter((l) => l.endAt <= now).length;
    const pct = Math.round((passed / total) * 100);
    const marked = all.filter((l) => doc.done[lkey(l)]).length;

    // прогресс
    let html = '<h2>Прогресс семестра</h2><div class="stat">' +
      `<div class="big">${pct}%</div><div class="bar thick"><i style="width:${pct}%"></i></div>` +
      `<div class="meta">Пройдено пар: ${passed} из ${total}. По расписанию с ${human(all[0].date)} по ${human(all[all.length - 1].date)}.` +
      ` Отмечено вручную: ${marked}.</div></div>`;

    // по предметам
    const subj = new Map();
    for (const l of all) {
      const k = skey(l);
      if (!subj.has(k)) subj.set(k, { name: l.subject, total: 0, passed: 0, kinds: {} });
      const x = subj.get(k);
      x.total += 1;
      if (l.endAt <= now) x.passed += 1;
      const kd = l.kind || 'другое';
      x.kinds[kd] = (x.kinds[kd] || 0) + 1;
    }
    const rows = [...subj.entries()].sort((a, b) => b[1].total - a[1].total || a[1].name.localeCompare(b[1].name, 'ru'));
    html += '<h2>По предметам</h2>' + rows.map(([k, x]) => {
      const col = colorOf(k);
      const w = Math.round((x.passed / x.total) * 100);
      return `<div class="subj${col ? ' colored' : ''}"${col ? ` style="--c:${col}"` : ''}>` +
        `<div class="rl"><b>${esc(x.name)}</b><span>${x.passed} из ${x.total}</span></div>` +
        `<div class="bar"><i style="width:${w}%"></i></div>` +
        `<div class="meta">${Object.entries(x.kinds).map(([kd, n]) => `${esc(kd)} ${n}`).join(', ')}</div></div>`;
    }).join('');

    // ДЗ
    const hwAll = Object.entries(doc.hw);
    const active = hwAll.filter(([, v]) => !v.done).map(([k, v]) => {
      const nx = all.find((l) => l.startAt > now && skey(l) === k && !isDone(l));
      return { k, name: v.name || k, text: v.text, due: nx ? nx.date : null };
    }).sort((a, b) => (a.due || '9999') < (b.due || '9999') ? -1 : (a.due || '9999') > (b.due || '9999') ? 1 : 0);
    html += '<h2>ДЗ</h2><div class="tiles">' +
      `<div class="tile"><b>${active.length}</b><span>активных</span></div>` +
      `<div class="tile"><b>${hwAll.length - active.length}</b><span>выполнено</span></div></div>`;
    html += active.map((a) => {
      const col = colorOf(a.k);
      return `<button class="hwitem${col ? ' colored' : ''}"${col ? ` style="--c:${col}"` : ''} data-act="hw" data-sk="${esc(a.k)}">` +
        `<b>${esc(a.name)}</b><span>${esc(a.text)}</span>` +
        `<span class="due">${a.due ? 'Сдать к ' + WD[dow(a.due)] + ', ' + human(a.due) : 'Ближайших пар по предмету нет'}</span></button>`;
    }).join('');

    // нагрузка
    const days = new Map();
    for (const l of all) {
      let d = days.get(l.date);
      if (!d) { d = { date: l.date, n: 0, first: l.start, last: l.end }; days.set(l.date, d); }
      d.n += 1;
      if (l.start < d.first) d.first = l.start;
      if (l.end > d.last) d.last = l.end;
    }
    const span = (d) => toMin(d.last) - toMin(d.first);
    const top = [...days.values()].filter((d) => d.date >= today)
      .sort((a, b) => b.n - a.n || span(b) - span(a) || (a.date < b.date ? -1 : 1)).slice(0, 5);
    if (top.length) {
      const maxN = top[0].n;
      html += '<h2>Самые загруженные дни впереди</h2>' + top.map((d) =>
        `<div class="dayrow"><div class="rl"><b>${WD[dow(d.date)]}, ${human(d.date)}</b><span>пар: ${d.n}</span></div>` +
        `<div class="bar"><i style="width:${Math.round((d.n / maxN) * 100)}%"></i></div>` +
        `<div class="meta">${esc(d.first)}–${esc(d.last)}</div></div>`).join('');
    }
    const byDow = [0, 0, 0, 0, 0, 0, 0];
    for (const l of all) byDow[dow(l.date)] += 1;
    const order = [1, 2, 3, 4, 5, 6, 0].filter((i, n) => n < 6 || byDow[i] > 0);
    const maxD = Math.max.apply(null, order.map((i) => byDow[i])) || 1;
    html += '<h2>Всего пар по дням недели</h2>' + order.map((i) =>
      `<div class="dayrow"><div class="rl"><b>${WD[i]}</b><span>${byDow[i]}</span></div>` +
      `<div class="bar"><i style="width:${Math.round((byDow[i] / maxD) * 100)}%"></i></div></div>`).join('');
    return html;
  }

  // ---------- сообщения о состоянии общего хранилища ----------
  function syncNote() {
    const s = state.sync;
    if (s.code === 'browser') return '<div class="note">ДЗ и отметки работают только внутри Telegram.</div>';
    if (s.code === 'off') return '<div class="note warn">Общее хранилище ещё не настроено на сервере, ДЗ пока недоступно.</div>';
    if (s.code === 'denied') return `<div class="note warn">Нет доступа к ДЗ. Твой Telegram ID: <b>${esc(s.id)}</b>. Его нужно добавить в ME_TG_ID или HER_TG_ID на Vercel.</div>`;
    if (s.code === 'error') return `<div class="note">Не удалось получить ДЗ (${esc(s.msg || 'ошибка')}), показаны сохранённые.</div>`;
    return '';
  }

  // ---------- общий рендер ----------
  function render() {
    const app = document.getElementById('app');
    const openStates = [...app.querySelectorAll('details')].map((d) => d.open);
    const ae = document.activeElement;
    const keepQ = ae && ae.id === 'q' ? { s: ae.selectionStart, e: ae.selectionEnd } : null;
    document.documentElement.dataset.profile = state.profile;
    const d = state.data[state.profile];
    const sw = ['me', 'her'].map((p) => {
      const g = state.data[p] && state.data[p].group;
      return `<button data-act="profile" data-p="${p}" aria-pressed="${p === state.profile}">${LABEL[p]}<small>${esc(g || '')}</small></button>`;
    }).join('');
    let body = syncNote();
    if (state.who && state.who !== state.profile) body += `<div class="ro">Расписание ${esc(LABEL[state.profile])}: только просмотр</div>`;
    if (state.err) {
      body += `<div class="err">${d ? 'Не удалось обновить, показаны сохранённые данные.' : 'Не удалось загрузить расписание.'} (${esc(state.err)})` +
        '<br><button data-act="refresh">Повторить</button></div>';
    }
    if (d) {
      body += { today: viewToday, week: viewWeek, month: viewMonth, subjects: viewSubjects, search: viewSearch, stats: viewStats }[state.tab](allLessons());
      const t = d.fetchedAt
        ? new Date(d.fetchedAt).toLocaleTimeString('ru-RU', { timeZone: 'Europe/Moscow', hour: '2-digit', minute: '2-digit' })
        : '';
      const partial = d.errors && d.errors.length ? ' Часть недель не загрузилась.' : '';
      const pend = hasPending() ? ' Есть несохранённые изменения.' : '';
      body += `<div class="status"><span>${state.loading ? 'Обновляю…' : 'Обновлено в ' + t + '.' + partial + pend}</span>` +
        '<button data-act="refresh">Обновить</button></div>';
    } else if (state.loading) {
      body += '<div class="empty"><div class="ttl">Загружаю расписание…</div></div>';
    }
    const tabs = [['today', 'Сегодня'], ['cal', 'Календарь'], ['search', 'Поиск'], ['stats', 'Итоги']].map(([k, t]) =>
      `<button data-act="tab" data-tab="${k}" aria-pressed="${k === (state.tab === 'week' || state.tab === 'month' || state.tab === 'subjects' ? 'cal' : state.tab)}">${t}</button>`).join('');
    app.innerHTML = `<div class="top"><div class="switch">${sw}</div><button class="themebtn" data-act="theme" aria-label="Настройки">Настройки</button></div>${body}<nav class="tabs">${tabs}</nav>${canEdit() && d && state.tab !== 'stats' ? '<button class="fab" data-act="add" aria-label="Добавить свою пару">+</button>' : ''}`;
    app.querySelectorAll('details').forEach((el, i) => { if (openStates[i]) el.open = true; });
    if (keepQ) { const q = document.getElementById('q'); if (q) { q.focus(); try { q.setSelectionRange(keepQ.s, keepQ.e); } catch (x) {} } }
  }

  // ---------- расписание ----------
  async function load(profile) {
    if (!state.data[profile]) { const c = readCache(profile); if (c) state.data[profile] = c; }
    state.loading = true; state.err = null;
    render();
    try {
      const r = await fetch('/api/schedule?profile=' + profile);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      state.data[profile] = { lessons: j.lessons, group: j.group, fetchedAt: j.fetchedAt, errors: j.errors || [] };
      writeCache(profile, state.data[profile]);
    } catch (e) {
      state.err = e.message || 'сеть недоступна';
    } finally {
      state.loading = false;
      if (state.profile === profile) render();
    }
  }

  let lastChangesAt = 0;
  async function loadChanges() {
    if (!tg || !tg.initData || !state.who) return;
    try {
      const r = await fetch('/api/changes', { headers: { 'X-Init-Data': tg.initData }, cache: 'no-store' });
      if (!r.ok) return;
      const j = await r.json();
      state.changes = { me: (j.items && j.items.me) || [], her: (j.items && j.items.her) || [] };
      store.set('parket.changes', JSON.stringify(state.changes));
      lastChangesAt = Date.now();
    } catch (e) { /* журнал необязателен */ }
  }

  async function loadQuiet(profile) {
    if (!state.data[profile]) { const c = readCache(profile); if (c) { state.data[profile] = c; render(); } }
    try {
      const r = await fetch('/api/schedule?profile=' + profile);
      if (!r.ok) return;
      const j = await r.json();
      state.data[profile] = { lessons: j.lessons, group: j.group, fetchedAt: j.fetchedAt, errors: j.errors || [] };
      writeCache(profile, state.data[profile]);
      render();
    } catch (e) { /* второй профиль необязателен */ }
  }

  // ---------- общее хранилище: ДЗ и отметки ----------
  const hasPending = () => Object.keys(pending.hw).length + Object.keys(pending.done).length + Object.keys(pending.colors).length + Object.keys(pending.custom).length + Object.keys(pending.prefs).length > 0;
  const persistState = () => store.set('parket.state', JSON.stringify({ who: state.who, docs: state.docs }));
  const persistPending = () => store.set('parket.pending', JSON.stringify(pending));
  let lastStateAt = 0;

  function applyLocal(doc, patch) {
    const now = Date.now();
    for (const [k, v] of Object.entries(patch.hw || {})) {
      if (!v || !v.text) delete doc.hw[k];
      else doc.hw[k] = { name: v.name || '', text: v.text, done: !!v.done, t: now };
    }
    for (const [k, v] of Object.entries(patch.done || {})) {
      if (v) doc.done[k] = now; else delete doc.done[k];
    }
    if (!doc.prefs) doc.prefs = {};
    if (patch.prefs && typeof patch.prefs.notify === 'boolean') doc.prefs.notify = patch.prefs.notify;
    if (patch.prefs && patch.prefs.seen) doc.prefs.seen = Object.assign({}, doc.prefs.seen, patch.prefs.seen);
    if (!doc.custom) doc.custom = {};
    for (const [k, v] of Object.entries(patch.custom || {})) {
      if (v) doc.custom[k] = Object.assign({}, v, { t: now }); else delete doc.custom[k];
    }
    if (!doc.colors) doc.colors = {};
    for (const [k, v] of Object.entries(patch.colors || {})) {
      if (Number.isInteger(v) && v >= 0 && v < PALETTE.length) doc.colors[k] = v; else delete doc.colors[k];
    }
  }

  async function loadState() {
    if (!tg || !tg.initData) { state.sync = { code: 'browser' }; return; }
    try {
      const r = await fetch('/api/state', { headers: { 'X-Init-Data': tg.initData }, cache: 'no-store' });
      const j = await r.json().catch(() => ({}));
      if (r.status === 403) { state.sync = { code: 'denied', id: j.yourId }; return; }
      if (r.status === 503) { state.sync = { code: 'off' }; return; }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      state.who = j.who;
      state.docs = { me: normDoc(j.docs && j.docs.me), her: normDoc(j.docs && j.docs.her) };
      applyLocal(state.docs[state.who], pending); // несохранённые правки остаются поверх серверных данных
      state.sync = { code: 'ok' };
      lastStateAt = Date.now();
      persistState();
    } catch (e) {
      state.sync = { code: 'error', msg: e.message };
    }
  }

  let flushing = false;
  async function flush() {
    if (flushing || !tg || !tg.initData || !state.who || !hasPending()) return;
    const snap = JSON.stringify(pending);
    flushing = true;
    try {
      const r = await fetch('/api/state', {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'X-Init-Data': tg.initData },
        body: snap,
      });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const sent = JSON.parse(snap);
      for (const k of Object.keys(sent.hw)) if (JSON.stringify(pending.hw[k]) === JSON.stringify(sent.hw[k])) delete pending.hw[k];
      for (const k of Object.keys(sent.done)) if (pending.done[k] === sent.done[k]) delete pending.done[k];
      for (const k of Object.keys(sent.colors || {})) if (pending.colors[k] === sent.colors[k]) delete pending.colors[k];
      for (const k of Object.keys(sent.custom || {})) if (JSON.stringify(pending.custom[k]) === JSON.stringify(sent.custom[k])) delete pending.custom[k];
      for (const k of Object.keys(sent.prefs || {})) if (JSON.stringify(pending.prefs[k]) === JSON.stringify(sent.prefs[k])) delete pending.prefs[k];
      persistPending();
    } catch (e) { /* останется в очереди, отправим при следующем случае */ }
    finally { flushing = false; render(); }
  }

  function save(patch) {
    if (!canEdit()) return;
    applyLocal(state.docs[state.who], patch);
    Object.assign(pending.hw, patch.hw || {});
    Object.assign(pending.done, patch.done || {});
    Object.assign(pending.colors, patch.colors || {});
    Object.assign(pending.custom, patch.custom || {});
    persistState(); persistPending();
    render();
    flush();
  }
  // настройки относятся к владельцу телефона и сохраняются, даже если открыт профиль партнёра
  function savePref(patch) {
    if (!state.who) return;
    applyLocal(state.docs[state.who], patch);
    const pp = patch.prefs || {};
    if (typeof pp.notify === 'boolean') pending.prefs.notify = pp.notify;
    if (pp.seen) pending.prefs.seen = Object.assign({}, pending.prefs.seen, pp.seen);
    persistState(); persistPending();
    render();
    flush();
  }
  const notifyOn = () => !!state.who && state.docs[state.who].prefs.notify !== false;
  const saveHw = (sk, name, text, done) => save({ hw: { [sk]: text ? { name, text, done } : null } });

  // ---------- нижний лист с ДЗ ----------
  let sheetCtx = null;
  let formCtx = null;
  function closeSheet() {
    sheetCtx = null;
    formCtx = null;
    document.getElementById('sheet').innerHTML = '';
    document.body.style.overflow = '';
  }
  function openSheet(o) {
    const doc = curDoc();
    const hw = doc.hw[o.sk];
    const edit = canEdit();
    const l = o.lesson;
    sheetCtx = o;
    const cc = l && l.custom ? doc.custom[l.cid] : null;
    const own = cc ? `<div class="meta">Своя пара${cc.until ? ', каждую неделю до ' + human(cc.until) : ''}</div>` : '';
    const custBtns = cc && edit
      ? '<button class="btn" data-act="c-edit">Изменить пару</button>' +
        (cc.until ? '<button class="btn" data-act="c-skip">Пропустить только эту дату</button>' : '') +
        `<button class="btn danger" data-act="c-del">${cc.until ? 'Удалить всю серию' : 'Удалить пару'}</button>`
      : '';
    const head = l
      ? `<div class="ttl">${esc(l.subject)}</div><div class="meta">${WD[dow(l.date)]}, ${human(l.date)}, ${esc(l.start)}–${esc(l.end)}${pairNo(l) ? ', ' + pairNo(l) + ' пара' : ''}</div>${own}`
      : `<div class="ttl">${esc(o.name || 'ДЗ')}</div>`;
    let body;
    if (edit) {
      const text = hw ? hw.text : '';
      const cur = doc.colors[o.sk];
      const sws = PALETTE.map(([c, n], i) => `<button class="sw" style="--c:${c}" data-act="color" data-i="${i}" aria-label="${n}" aria-pressed="${cur === i}"></button>`).join('') +
        `<button class="sw none" data-act="color" data-i="-1" aria-label="без цвета" aria-pressed="${!Number.isInteger(cur)}"></button>`;
      body = `<label>ДЗ по предмету <span class="cnt"><span id="cnt">${text.length}</span>/100</span>` +
        `<textarea id="hwtext" rows="3" maxlength="100" placeholder="Что задали">${esc(text)}</textarea></label>` +
        `<label>Цвет предмета</label><div class="swatches" id="swatches">${sws}</div><div class="btns">` +
        '<button class="btn primary" data-act="hw-save">Сохранить</button>' +
        (hw ? `<button class="btn" data-act="hw-toggle">${hw.done ? 'Вернуть в активные' : 'ДЗ выполнено'}</button>` +
              '<button class="btn danger" data-act="hw-del">Удалить ДЗ</button>' : '') +
        (l ? `<button class="btn" data-act="lesson-done">${doc.done[lkey(l)] ? 'Снять отметку «пройдена»' : 'Отметить пару пройденной'}</button>` : '') +
        custBtns + '<button class="btn" data-act="sheet-close">Закрыть</button></div>';
    } else {
      body = '<label>ДЗ по предмету</label><div class="view">' +
        (hw && hw.text ? esc(hw.text) + (hw.done ? '\n(выполнено)' : '') : 'ДЗ нет') + '</div>' +
        '<div class="btns"><button class="btn" data-act="sheet-close">Закрыть</button></div>';
    }
    document.getElementById('sheet').innerHTML =
      `<div class="sh-bg" data-act="sheet-close"></div><div class="sheet" role="dialog" aria-modal="true">${head}${body}</div>`;
    document.body.style.overflow = 'hidden';
    const ta = document.getElementById('hwtext');
    if (ta) ta.addEventListener('input', () => { document.getElementById('cnt').textContent = ta.value.length; });
  }



  function openSettings() {
    closeSheet();
    const cur = themePref();
    const chips = [['auto', 'Как в Telegram'], ['light', 'Светлая'], ['dark', 'Тёмная']].map(([v, t]) =>
      `<button class="chip" data-act="theme-set" data-v="${v}" aria-pressed="${cur === v}">${t}</button>`).join('');
    let notify;
    if (state.who && tg && tg.initData) {
      const on = notifyOn();
      notify = '<label>Вечернее напоминание в Telegram</label><div class="chips" id="notifychips">' +
        `<button class="chip" data-act="notify-set" data-v="1" aria-pressed="${on}">Включено</button>` +
        `<button class="chip" data-act="notify-set" data-v="0" aria-pressed="${!on}">Выключено</button></div>` +
        '<div class="meta">Каждый вечер около 20:00 по Москве бот присылает: твои пары на завтра, всё активное ДЗ и время занятости второго человека.</div>' +
        '<div class="btns"><button class="btn" id="notify-test" data-act="notify-test">Прислать пример сейчас</button></div>' +
        '<div class="meta" id="notify-status" role="status"></div>';
    } else {
      notify = '<label>Вечернее напоминание в Telegram</label><div class="meta">Работает только внутри Telegram, когда сервер настроен.</div>';
    }
    document.getElementById('sheet').innerHTML =
      '<div class="sh-bg" data-act="sheet-close"></div><div class="sheet" role="dialog" aria-modal="true">' +
      `<div class="ttl">Настройки</div><label>Тема</label><div class="chips" id="themechips">${chips}</div>${notify}` +
      '<div class="btns"><button class="btn" data-act="sheet-close">Готово</button></div></div>';
    document.body.style.overflow = 'hidden';
  }

  async function sendTestNotify() {
    const btn = document.getElementById('notify-test');
    const box = document.getElementById('notify-status');
    if (!btn || !box) return;
    btn.disabled = true;
    box.textContent = 'Отправляю…';
    try {
      const r = await fetch('/api/notify', { method: 'POST', headers: { 'X-Init-Data': tg.initData } });
      const j = await r.json().catch(() => ({}));
      if (r.ok) box.textContent = 'Отправлено, посмотри чат с ботом.';
      else if (/blocked|initiate|chat not found|deactivated/i.test(j.error || '')) box.textContent = 'Бот не может тебе написать. Открой чат с ботом и нажми Start.';
      else if (r.status === 503) box.textContent = 'На сервере не хватает настроек: ' + ((j.missing || []).join(', ') || 'проверь переменные') + '.';
      else box.textContent = 'Не получилось отправить (' + (j.error || 'HTTP ' + r.status) + ').';
    } catch (e) {
      box.textContent = 'Нет связи с сервером.';
    } finally {
      btn.disabled = false;
    }
  }

  // ---------- форма «Своя пара» ----------
  function defaultDate() {
    if (state.tab === 'week' && state.selDate) return state.selDate;
    if (state.tab === 'month' && state.calSel) return state.calSel;
    return nowStr().slice(0, 10);
  }
  const newId = () => (Date.now().toString(36) + Math.random().toString(36).slice(2, 8)).slice(0, 40);

  function openForm(id, c) {
    closeSheet();
    formCtx = { id: id || newId(), kind: c ? c.kind || '' : '', weekly: !!(c && c.until), skip: c && c.skip ? c.skip : [] };
    const v = c || { title: '', date: defaultDate(), start: '', end: '', room: '', teacher: '', until: '' };
    const chips = (act, opts, cur) => opts.map(([val, t]) =>
      `<button class="chip" type="button" data-act="${act}" data-v="${val}" aria-pressed="${cur === val}">${t}</button>`).join('');
    document.getElementById('sheet').innerHTML =
      '<div class="sh-bg" data-act="sheet-close"></div><div class="sheet" role="dialog" aria-modal="true">' +
      `<div class="ttl">${c ? 'Изменить пару' : 'Своя пара'}</div>` +
      `<label>Название<input id="f-title" class="in" maxlength="80" autocomplete="off" value="${esc(v.title)}"></label>` +
      `<label>Тип</label><div class="chips" id="f-kinds">${chips('f-kind', [['', 'Без типа'], ['лек', 'лек'], ['пр', 'пр'], ['лаб', 'лаб']], formCtx.kind)}</div>` +
      `<label>Дата<input id="f-date" class="in" type="date" value="${esc(v.date)}"></label>` +
      `<div class="row2"><label>Начало<input id="f-start" class="in" type="time" value="${esc(v.start)}"></label>` +
      `<label>Конец<input id="f-end" class="in" type="time" value="${esc(v.end)}"></label></div>` +
      '<label>Номер пары (подставит время)</label><div class="chips" id="f-slots">' +
      (SLOTS[state.profile] || []).map(([st, en], i) => `<button class="chip" type="button" data-act="f-slot" data-v="${i}" aria-pressed="${v.start === st && v.end === en}">${i + 1}</button>`).join('') + '</div>' +
      `<label>Аудитория<input id="f-room" class="in" maxlength="40" autocomplete="off" value="${esc(v.room)}"></label>` +
      `<label>Преподаватель<input id="f-teacher" class="in" maxlength="60" autocomplete="off" value="${esc(v.teacher)}"></label>` +
      `<label>Повтор</label><div class="chips" id="f-repeats">${chips('f-repeat', [['0', 'Не повторять'], ['1', 'Каждую неделю']], formCtx.weekly ? '1' : '0')}</div>` +
      `<label id="f-until-wrap"${formCtx.weekly ? '' : ' hidden'}>Повторять до<input id="f-until" class="in" type="date" value="${esc(v.until || '')}"></label>` +
      '<div class="err" id="f-err" hidden></div>' +
      '<div class="btns"><button class="btn primary" data-act="f-save">Сохранить</button><button class="btn" data-act="sheet-close">Отмена</button></div></div>';
    document.body.style.overflow = 'hidden';
  }

  function refreshSlotChips() {
    const st = document.getElementById('f-start');
    const en = document.getElementById('f-end');
    if (!st || !en) return;
    document.querySelectorAll('#f-slots .chip').forEach((el) => {
      const sl = (SLOTS[state.profile] || [])[Number(el.dataset.v)];
      el.setAttribute('aria-pressed', String(!!sl && sl[0] === st.value && sl[1] === en.value));
    });
  }

  function saveForm() {
    const val = (id) => document.getElementById(id).value.trim();
    const title = val('f-title'), date = val('f-date'), start = val('f-start'), end = val('f-end');
    const until = formCtx.weekly ? val('f-until') : '';
    let err = '';
    if (!title) err = 'Введи название пары.';
    else if (!date) err = 'Выбери дату.';
    else if (!start || !end) err = 'Укажи время начала и конца.';
    else if (end <= start) err = 'Конец должен быть позже начала.';
    else if (formCtx.weekly) {
      if (!until) err = 'Выбери, до какой даты повторять.';
      else if (until < date) err = 'Дата «повторять до» раньше даты пары.';
      else if ((Date.parse(until) - Date.parse(date)) / 864e5 > 400) err = 'Повтор не может быть дольше 400 дней (около 57 недель).';
    }
    if (err) {
      const box = document.getElementById('f-err');
      box.textContent = err; box.hidden = false;
      return;
    }
    const entry = { title, kind: formCtx.kind, date, start, end, room: val('f-room'), teacher: val('f-teacher') };
    if (until) {
      entry.until = until;
      const skip = formCtx.skip.filter((d) => d >= date && d <= until && ((Date.parse(d) - Date.parse(date)) / 864e5) % 7 === 0);
      if (skip.length) entry.skip = skip;
    }
    save({ custom: { [formCtx.id]: entry } });
    closeSheet();
  }

  function confirmTG(msg, ok) {
    if (tg && tg.showConfirm) {
      try { tg.showConfirm(msg, (r) => { if (r) ok(); }); return; } catch (e) { /* старый клиент */ }
    }
    if (window.confirm(msg)) ok();
  }

  // ---------- «отменить» на 20 секунд ----------
  let toastTimer = null;
  let undoFn = null;
  function hideToast() {
    clearInterval(toastTimer);
    undoFn = null;
    document.getElementById('toast').hidden = true;
  }
  function toast(msg, undo) {
    clearInterval(toastTimer);
    const el = document.getElementById('toast');
    let left = 20;
    undoFn = undo;
    const paint = () => { el.innerHTML = `<span>${esc(msg)}</span><button data-act="undo">Отменить (${left})</button>`; };
    el.hidden = false;
    paint();
    toastTimer = setInterval(() => { left -= 1; if (left <= 0) hideToast(); else paint(); }, 1000);
  }

  // ---------- события ----------
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const act = b.dataset.act;
    if (act === 'open') {
      if (e.target.closest('details')) return;
      const all = allLessons();
      const l = all.find((x) => lkey(x) === b.dataset.k);
      if (l) openSheet({ sk: skey(l), name: l.subject, lesson: l });
      return;
    }
    if (act === 'hw') {
      const h = curDoc().hw[b.dataset.sk];
      openSheet({ sk: b.dataset.sk, name: h ? h.name : '', lesson: null });
      return;
    }
    if (act === 'add') { if (canEdit()) openForm(null, null); return; }
    if (act === 'c-edit' && sheetCtx && sheetCtx.lesson && sheetCtx.lesson.custom) {
      const id = sheetCtx.lesson.cid;
      openForm(id, curDoc().custom[id]);
      return;
    }
    if (act === 'c-skip' && sheetCtx && sheetCtx.lesson && sheetCtx.lesson.custom) {
      const l = sheetCtx.lesson;
      const old = curDoc().custom[l.cid];
      if (old) {
        const skip = Array.from(new Set((old.skip || []).concat(l.date)));
        save({ custom: { [l.cid]: Object.assign({}, old, { skip }) } });
        closeSheet();
        toast('Дата пропущена', () => save({ custom: { [l.cid]: old } }));
      }
      return;
    }
    if (act === 'c-del' && sheetCtx && sheetCtx.lesson && sheetCtx.lesson.custom) {
      const l = sheetCtx.lesson;
      const old = curDoc().custom[l.cid];
      if (!old) return;
      confirmTG(old.until ? 'Удалить всю серию «' + old.title + '»?' : 'Удалить пару «' + old.title + '»?', () => {
        save({ custom: { [l.cid]: null } });
        closeSheet();
        toast('Пара удалена', () => save({ custom: { [l.cid]: old } }));
      });
      return;
    }
    if (act === 'f-kind' && formCtx) {
      formCtx.kind = b.dataset.v;
      document.querySelectorAll('#f-kinds .chip').forEach((el) => el.setAttribute('aria-pressed', String(el.dataset.v === formCtx.kind)));
      return;
    }
    if (act === 'f-repeat' && formCtx) {
      formCtx.weekly = b.dataset.v === '1';
      document.querySelectorAll('#f-repeats .chip').forEach((el) => el.setAttribute('aria-pressed', String(el.dataset.v === b.dataset.v)));
      document.getElementById('f-until-wrap').hidden = !formCtx.weekly;
      const u = document.getElementById('f-until');
      const dt = document.getElementById('f-date').value;
      if (formCtx.weekly && !u.value && dt) u.value = addDays(dt, 56);   // по умолчанию 8 недель
      return;
    }
    if (act === 'f-slot' && formCtx) {
      const sl = (SLOTS[state.profile] || [])[Number(b.dataset.v)];
      if (sl) { document.getElementById('f-start').value = sl[0]; document.getElementById('f-end').value = sl[1]; refreshSlotChips(); }
      return;
    }
    if (act === 'f-save' && formCtx) { saveForm(); return; }
    if (act === 'theme') { openSettings(); return; }
    if (act === 'notify-set') {
      savePref({ prefs: { notify: b.dataset.v === '1' } });
      document.querySelectorAll('#notifychips .chip').forEach((el) => el.setAttribute('aria-pressed', String((el.dataset.v === '1') === notifyOn())));
      return;
    }
    if (act === 'notify-test') { sendTestNotify(); return; }
    if (act === 'theme-set') {
      store.set('parket.theme', b.dataset.v);
      applyTheme();
      document.querySelectorAll('#themechips .chip').forEach((el) => el.setAttribute('aria-pressed', String(el.dataset.v === b.dataset.v)));
      return;
    }
    if (act === 'chg-read') {
      const latest = relevantChanges(state.profile).reduce((m, e) => (e.t > m ? e.t : m), '');
      if (latest) savePref({ prefs: { seen: { [state.profile]: latest } } });
      return;
    }
    if (act === 'sheet-close') { closeSheet(); return; }
    if (act === 'color' && sheetCtx) {
      const i = Number(b.dataset.i);
      save({ colors: { [sheetCtx.sk]: i >= 0 ? i : null } });
      const cur = curDoc().colors[sheetCtx.sk];
      document.querySelectorAll('#swatches .sw').forEach((el) => {
        const n = Number(el.dataset.i);
        el.setAttribute('aria-pressed', String(n < 0 ? !Number.isInteger(cur) : n === cur));
      });
      return;
    }
    if (act === 'hw-save' && sheetCtx) {
      const text = document.getElementById('hwtext').value.trim().slice(0, 100);
      saveHw(sheetCtx.sk, sheetCtx.name, text, false); closeSheet(); return;
    }
    if (act === 'hw-toggle' && sheetCtx) {
      const h = curDoc().hw[sheetCtx.sk];
      if (h) saveHw(sheetCtx.sk, h.name || sheetCtx.name, h.text, !h.done);
      closeSheet(); return;
    }
    if (act === 'hw-del' && sheetCtx) { save({ hw: { [sheetCtx.sk]: null } }); closeSheet(); return; }
    if (act === 'lesson-done' && sheetCtx && sheetCtx.lesson) {
      const l = sheetCtx.lesson;
      const k = lkey(l);
      if (curDoc().done[k]) { save({ done: { [k]: null } }); closeSheet(); return; }
      confirmTG('Отметить пару «' + l.subject + '» пройденной?', () => {
        save({ done: { [k]: true } });
        closeSheet();
        toast('Пара отмечена пройденной', () => save({ done: { [k]: null } }));
      });
      return;
    }
    if (act === 'undo') { const f = undoFn; hideToast(); if (f) f(); return; }
    if (act === 'profile' && b.dataset.p !== state.profile) {
      state.userPicked = true;
      state.profile = b.dataset.p; state.weekOf = null; state.selDate = null;
      store.set('parket.profile', state.profile);
      load(state.profile);
    } else if (act === 'tab') {
      let tb = b.dataset.tab;
      if (tb === 'cal') tb = state.calMode;                       // «Календарь» открывается в последнем масштабе
      if (tb === 'week' || tb === 'month' || tb === 'subjects') { state.calMode = tb; store.set('parket.calmode', tb); }
      state.tab = tb; store.set('parket.tab', tb); render();
    } else if (act === 'prev' || act === 'next') {
      state.weekOf = addDays(state.weekOf, act === 'next' ? 7 : -7); state.selDate = null; render();
    } else if (act === 'day') {
      state.selDate = b.dataset.date; render();
    } else if (act === 'today') {
      state.weekOf = null; state.selDate = null; render();
    } else if (act === 'mprev' || act === 'mnext') {
      const [yy, mm] = state.month.split('-').map(Number);
      const nd = new Date(Date.UTC(yy, mm - 1 + (act === 'mnext' ? 1 : -1), 1));
      state.month = nd.getUTCFullYear() + '-' + pad(nd.getUTCMonth() + 1); state.calSel = null; render();
    } else if (act === 'mtoday') {
      state.month = null; state.calSel = null; render();
    } else if (act === 'cell') {
      state.calSel = b.dataset.date; render();
    } else if (act === 'kind') {
      state.kind = b.dataset.v; state.limit = 50; render();
    } else if (act === 'tgl') {
      state[b.dataset.v] = !state[b.dataset.v]; state.limit = 50; render();
    } else if (act === 'more') {
      state.limit += 50; render();
    } else if (act === 'refresh') {
      load(state.profile);
      loadQuiet(otherOf(state.profile));
      loadChanges().then(render);
      loadState().then(() => { render(); flush(); });
    }
    if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.selectionChanged(); } catch (x) {} }
  });

  document.addEventListener('input', (e) => {
    if (e.target.id === 'f-start' || e.target.id === 'f-end') { refreshSlotChips(); return; }
    if (e.target.id !== 'q') return;
    state.q = e.target.value; state.limit = 50;
    const r = document.getElementById('results');
    if (r) r.innerHTML = resultsHTML(allLessons());
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { closeSheet(); return; }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.lesson[data-act="open"], .subjrow[data-act="open"]')) {
      e.preventDefault();
      e.target.click();
    }
  });

  setInterval(() => {
    if (document.hidden) return;
    if (hasPending()) flush();
    if (state.tab === 'today' && state.data[state.profile]) render();
  }, 30000);

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    const d = state.data[state.profile];
    if (d && Date.now() - Date.parse(d.fetchedAt) > 15 * 60000) load(state.profile); else render();
    if (Date.now() - lastStateAt > 60000) loadState().then(() => { render(); flush(); });
    if (Date.now() - lastChangesAt > 5 * 60000) loadChanges().then(render);
  });

  // ---------- старт ----------
  render();
  load(state.profile);
  loadQuiet(otherOf(state.profile));
  loadState().then(() => {
    if (state.who && !state.userPicked && state.profile !== state.who) {
      state.profile = state.who; state.weekOf = null; state.selDate = null;
      load(state.profile);
      loadQuiet(otherOf(state.profile));
    } else {
      render();
    }
    flush();
    loadChanges().then(render);
  });
})();
</script>
</body>
</html>
