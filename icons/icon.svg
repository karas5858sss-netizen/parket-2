<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#1f6fd1"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border highlight -->
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>

  <!-- Main Calendar Glass Card -->
  <g filter="url(#shadow)">
    <rect x="76" y="96" width="360" height="320" rx="36" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
    
    <!-- Calendar Header Bar -->
    <path d="M 76 132 C 76 112 92 96 112 96 L 400 96 C 420 96 436 112 436 132 L 436 168 L 76 168 Z" fill="#ffffff" fill-opacity="0.12"/>
    
    <!-- Binder Rings / Pins -->
    <rect x="156" y="74" width="20" height="44" rx="10" fill="#ffffff" fill-opacity="0.9"/>
    <rect x="336" y="74" width="20" height="44" rx="10" fill="#ffffff" fill-opacity="0.9"/>

    <!-- Left Partner Indicator (Blue - Кирилл) -->
    <circle cx="166" cy="236" r="38" fill="url(#blueGrad)"/>
    <rect x="136" y="296" width="60" height="12" rx="6" fill="#ffffff" fill-opacity="0.6"/>
    <rect x="146" y="320" width="40" height="10" rx="5" fill="#ffffff" fill-opacity="0.35"/>

    <!-- Right Partner Indicator (Pink - Маша) -->
    <circle cx="346" cy="236" r="38" fill="url(#pinkGrad)"/>
    <rect x="316" y="296" width="60" height="12" rx="6" fill="#ffffff" fill-opacity="0.6"/>
    <rect x="326" y="320" width="40" height="10" rx="5" fill="#ffffff" fill-opacity="0.35"/>

    <!-- Center Bridge: Heart / Intersecting connection -->
    <path d="M 256 226 
             C 256 214 244 204 232 204 
             C 218 204 208 216 208 230 
             C 208 248 228 266 256 288 
             C 284 266 304 248 304 230 
             C 304 216 294 204 280 204 
             C 268 204 256 214 256 226 Z" 
          fill="#ffffff" fill-opacity="0.95"/>
          
    <!-- Pulse ring around connection -->
    <path d="M 210 248 Q 256 296 302 248" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
