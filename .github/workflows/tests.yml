# Запускает тесты при каждой заливке в репозиторий. Красный крестик на коммите = что-то сломалось.
name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Тесты
        working-directory: tests
        run: |
          npm ci --no-audit --no-fund
          npm test